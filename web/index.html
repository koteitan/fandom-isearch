<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fandom isearch</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%8E%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script>
    (function () {
      try {
        var state = JSON.parse(localStorage.getItem('fandom-isearch:ui') || '{}');
        if (state.dark !== false) document.documentElement.classList.add('dark');
      } catch (_) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
</head>
<body>
  <header class="page-header">
    <a class="brand" href="./" aria-label="fandom isearch home" data-i18n-aria-label="homeLabel">
      <span class="brand-mark">⌕</span>
      <h1>fandom isearch</h1>
    </a>
    <div class="menu-container" id="menuContainer">
      <button type="button" class="menu-toggle" id="menuToggle"
        aria-label="Menu" data-i18n-aria-label="menuLabel"
        aria-expanded="false" aria-controls="menuDropdown">☰</button>
      <div class="menu-dropdown" id="menuDropdown">
        <label class="checkbox-row">
          <input id="darkMode" type="checkbox">
          <span data-i18n="darkMode">Dark mode</span>
        </label>
      </div>
    </div>
  </header>

  <div class="protocol-warning" id="protocolWarning" hidden>
    <span data-i18n="protocolBefore">SQLite WebAssembly cannot load from</span>
    <code>file://</code>
    <span data-i18n="protocolAfterRun">. Run</span> <code>./serve</code>
    <span data-i18n="protocolAfterOpen">in the repository and open the displayed URL.</span>
  </div>

  <main>
    <section class="search-panel" aria-label="Search" data-i18n-aria-label="searchLabel">
      <div class="database-row">
        <label for="database" data-i18n="archive">Archive</label>
        <select id="database" disabled>
          <option data-i18n="loadingDatabaseList">Loading database list…</option>
        </select>
      </div>

      <input id="query" type="search" placeholder="Search… (substring match)"
        data-i18n-placeholder="searchPlaceholder"
        aria-label="Search query" data-i18n-aria-label="searchQueryLabel"
        aria-describedby="searchHelp"
        autocomplete="off" spellcheck="false" autofocus disabled>
      <p class="search-help" id="searchHelp">
        <span data-i18n="searchHelpBefore">Spaces mean AND;</span>
        <code>OR</code> <span data-i18n="searchHelpMiddle">means OR;</span>
        <code>"abc def"</code> <span data-i18n="searchHelpAfter">matches a phrase containing a space</span>
      </p>

      <fieldset class="target-fields">
        <legend data-i18n="searchTargets">Search targets</legend>
        <label class="checkbox-row">
          <input type="checkbox" name="field" value="title" checked>
          <span data-i18n="pageTitle">Page title</span>
        </label>
        <label class="checkbox-row">
          <input type="checkbox" name="field" value="body" checked>
          <span data-i18n="body">Body</span>
        </label>
        <label class="checkbox-row">
          <input type="checkbox" name="field" value="author" checked>
          <span data-i18n="editor">Editor</span>
        </label>
      </fieldset>

      <details class="namespace-filter" id="namespaceDetails">
        <summary>
          <span data-i18n="namespaces">Namespaces</span>
          <span class="selection-summary" id="namespaceSummary" data-i18n="loading">Loading…</span>
        </summary>
        <div class="namespace-actions">
          <button type="button" id="selectAllNamespaces" data-i18n="selectAll">Select all</button>
          <button type="button" id="clearNamespaces" data-i18n="clearAll">Clear all</button>
        </div>
        <div class="namespace-grid" id="namespaceGrid"></div>
      </details>
    </section>

    <div class="meta" id="meta" role="status" aria-live="polite" data-i18n="loadingDatabase">Loading database…</div>
    <section class="results" id="results" aria-label="Search results" data-i18n-aria-label="searchResultsLabel"></section>
  </main>

  <footer>
    <a href="./">fandom isearch</a> <span id="appVersion"></span><br>
    MediaWiki XML + SQLite FTS5
  </footer>

  <script src="i18n.js"></script>
  <script>
    if (location.protocol === 'file:') {
      document.getElementById('protocolWarning').hidden = false;
      document.getElementById('meta').textContent = window.FandomI18n.t('httpRequired');
    }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
